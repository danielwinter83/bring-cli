[project]
name = "bring-cli"
version = "0.1.0"
description = "CLI for the Bring! shopping list API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "bring-api>=3.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
bring = "bring_cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
