[project]
name = "bring-cli"
version = "0.1.0"
description = "CLI for the Bring! shopping list API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "bring-api>=1.0.0,<4.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
bring = "bring_cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["bring_cli/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): v{version}"
build_command = ""
